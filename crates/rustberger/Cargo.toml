[package]
name = "rustberger"
description = "Pure-Rust port of the Bergamot (Marian student) translation engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
rayon = { version = "1", optional = true }
wgpu = { version = "30", optional = true, default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "gles"] }
pollster = { version = "1", optional = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
gpu = ["dep:wgpu", "dep:pollster"]

[dev-dependencies]
